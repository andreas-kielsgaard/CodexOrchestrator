[package]
name = "orchid-services"
version = "0.1.0"
edition = "2021"

[dependencies]
orchid-core = { path = "../orchid-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
