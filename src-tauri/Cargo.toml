[package]
name = "codex-orchestrator"
version = "0.1.0"
description = "Local-first orchestration shell for Codex tasks"
authors = ["Codex Orchestrator contributors"]
edition = "2021"

[lib]
name = "codex_orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

