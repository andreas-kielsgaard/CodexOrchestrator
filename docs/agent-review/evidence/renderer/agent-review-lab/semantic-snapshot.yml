  - region "Owned instance → bounded evidence":
    - paragraph: Worktree convergence
    - heading "Owned instance → bounded evidence" [level=2]
    - paragraph: Interface defined · application integration unproven
    - heading "Application request" [level=4]
    - paragraph: The application requests one development/test instance for an expected worktree path, commit, and source fingerprint, with isolated data, scrubbed credentials, ephemeral ports, required capabilities, and mandatory cleanup.
    - heading "Runtime result" [level=4]
    - paragraph: The worktree runtime owns build and launch, then returns named instance/build/session identity, an HTTP endpoint or opaque window reference, semantic capabilities, and runtime/review evidence roots.
    - heading "Review adapter" [level=4]
    - paragraph: A lane adapter validates the handoff, performs driver-specific interaction, retains evidence beside the runtime manifest, and returns neutral evidence for a separate review judgement.
    - paragraph: The current proofs were launched by dedicated scripts. This branch defines but does not yet integrate the application-to-worktree-runtime lifecycle port.
  - region "Keep inspection contained":
    - paragraph: Operating boundary
    - heading "Keep inspection contained" [level=2]
    - term: Worktree instance
    - definition: Build, launch, endpoint/window ownership, and cleanup belong to the worktree runtime. Review adapters receive semantic references, not process or driver authority.
    - term: Security
    - definition: Remote debugging is development-only. The recorded endpoint was consumed through loopback and must never be enabled in production.
    - term: Dependency risk
    - definition: The 2026-07-27 npm audit reports one unchanged-baseline high production finding and 28 full-tree package findings; 22 affected packages belong to the development-only WDIO chain.
    - term: Sandbox
    - definition: Renderer scenarios are effect-limited. CDP page access grants inspection only, not orchestration or native authority.
    - term: Lifecycle
    - definition: The launched app/server process tree was cleaned up after capture; the endpoint is no longer active.
    - term: Process ownership
    - definition: Attach only to the launched development host and its single expected target, never unrelated browser processes.
    - term: Port
    - definition: Port 0 selects an ephemeral port. Discover it from DevToolsActivePort; do not hard-code or expose it.
    - term: Credentials
    - definition: The launch adapters removed CODEX_HOME and credential-shaped environment variables. The scenarios required and retained no credentials.
    - term: Production exclusion
    - definition: This lab, recorded clients, debugging arguments, and scoped user-data folder belong only to development/test composition.